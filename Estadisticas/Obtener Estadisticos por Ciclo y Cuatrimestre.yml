info:
  name: Obtener Estadisticos por Ciclo y Cuatrimestre
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/estadisticas?cicloId=1&cuatrimestreId=3"
  params:
    - name: cicloId
      value: "1"
      type: query
    - name: cuatrimestreId
      value: "3"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
