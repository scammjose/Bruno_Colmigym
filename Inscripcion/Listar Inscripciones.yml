info:
  name: Listar Inscripciones
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/inscripcion?excluirHistoricos=false"
  params:
    - name: excluirHistoricos
      value: "false"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
